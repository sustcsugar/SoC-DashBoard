# 参考 SoC 配置
#
# 移动/消费类 AP，单层全交叉开关，PSRAM 硬核 + AXI SRAM。
#
# ⚠️ 所有数值标注为「占位」的都取自公开数据手册的典型量级，**仅用于打通流程**。
#    真实决策前必须替换为你的实际配置与厂商手册数据。见 docs/adr/0000-背景与约束.md 第 1.4 节。

run:
  name: reference_ap
  duration_us: 200.0      # 逐交易窗口。ms 级需要 Stage 2 的事件跳跃优化
  warmup_us: 20.0         # 预热：不设会让延迟分位数被启动瞬态污染
  seed: 12345
  bucket_ns: 500.0        # 带宽时序的桶宽
  max_events: 50000000

clocks:
  axi_hp:
    freq_mhz: 400.0       # 占位：待填
    width_b: 8            # 64 bit

# --- 存储 IP 性能包络 ---
# 硬核不可改，所以建模它的 AXI 侧可观测特性，而不是内部 bank/row 时序。
# 换一颗 PSRAM 或将来加 DDR，只是换这份参数，模型结构不变。
envelopes:
  psram_main:
    name: psram_main
    peak_gbps: 4.256             # 占位：x8 DDR @ 266MHz
    sustained_rd_gbps: 3.20      # 占位：**架构决策必须用这个，不是峰值**
    sustained_wr_gbps: 2.60
    latency_idle_ns: 180.0       # 占位：空载往返，可被流水掩盖
    max_outstanding_rd: 16       # ★ 决定有效带宽的头号旋钮
    max_outstanding_wr: 16
    rd_wr_turnaround_ns: 120.0   # 占位：同 rank 内写→读惩罚最大
    cmd_overhead_ns: 15.0
    refresh_overhead: 0.017      # 1.7% @ 100MHz 量级
    max_burst_bytes: 256
    data_width_b: 8
    # --- 调度行为：写缓冲水位滞回 ---
    # 读写不对称是物理事实：读的发起方在等数据，写丢进缓冲就完事。
    # 所以读按需服务、写攒批排出，方向切换的代价被摊薄到整批事务上。
    direction_batching: true
    lookahead_depth: 32          # 命令调度器一次能看到多少待处理事务
    write_buffer_bytes: 4096     # ★ 写缓冲是批处理的来源；调小它会放大翻转损耗
    write_drain_high_frac: 0.75  # 占用超过 75% 开始排空
    write_drain_low_frac: 0.25   # 排到 25% 以下切回读。滞回区间防止方向反复横跳
    write_starve_ns: 3000.0      # 写最长等待，防止读流量永不间断时写被无限推迟
    read_starve_ns: 800.0        # 读最长等待。远小于写——读是延迟敏感的
    # 厂商提供实测曲线时填这里，比单一空载延迟准得多
    latency_vs_outstanding:
      - {ot: 1,  lat_ns: 180.0}
      - {ot: 2,  lat_ns: 190.0}
      - {ot: 4,  lat_ns: 215.0}
      - {ot: 8,  lat_ns: 260.0}
      - {ot: 16, lat_ns: 340.0}
    notes: 占位值，待替换为 IP 厂商手册数据

interconnect:
  name: xbar_hp
  policy: drr            # ★ 默认 DRR。rr 给的是每事务公平，在 AXI 上是错的语义
  arb_latency_cycles: 2
  clock: axi_hp
  max_burst_bytes: 256
  aging_ns: 5000.0       # 优先级老化阈值（policy: prio 时生效）
  weights: {}            # drr/wrr 的权重；空则各流等权

slaves:
  psram0:
    kind: hardmac
    envelope: psram_main
    queue_depth: 16      # 有界是死锁可检的前提
    base_addr: 0x0000_0000
    size_bytes: 0x1000_0000     # 256 MB

  sram0:
    kind: sram
    n_banks: 8
    interleave_bytes: 256       # 交织粒度：太小会跨 bank 拆包，太大则并行度用不上
    bank_gbps: 3.2              # 占位：64bit @ 400MHz = 3.2 GB/s per bank
    access_latency_ns: 12.0
    queue_depth: 16
    ports: 1r1w                 # 双口：读写可并行
    lookahead_depth: 8
    base_addr: 0x8000_0000
    size_bytes: 0x0008_0000     # 512 KB

# --- 主设备 ---
# 流量类别对应三种**契约**，不是三个优先级：
#   latency     最小延迟契约（CPU）——延迟就是它的性能指标
#   isochronous 最大延迟契约（显示/摄像头）——有硬 deadline，要延迟上界
#   bandwidth   最小带宽契约（GPU/NPU/DMA）——容忍延迟，靠深 outstanding 提前跑
#   best_effort 尽力而为（网络等后台流量）
masters:
  cpu:
    queue_depth: 8
    max_outstanding: 16         # ★ 与 PSRAM 的 BDP 配对：不足则带宽被 Little's Law 封顶
    n_ids: 8                    # 同 ID 必须保序，ID 数决定并发能力与 HOL 阻塞范围
    port:
      traffic_class: latency
      target_gbps: 1.20
      pattern: bursty           # CPU 访存有突发性，不是泊松
      on_off_ratio: 0.5
      rd_ratio: 0.65
      burst_len: 7              # 8 拍
      burst_size: 3             # 8 字节/拍 → 64 字节/burst
      addr_mode: sequential
      targets: {psram0: 1.0}
      base_addr: 0x0000_0000
      size_bytes: 0x0400_0000
      qos: 13                   # ★ 13 而不是 15——留 15 给实时主设备濒死升级

  gpu:
    queue_depth: 8
    max_outstanding: 24
    n_ids: 8
    port:
      traffic_class: bandwidth
      target_gbps: 1.50
      pattern: poisson
      rd_ratio: 0.55
      burst_len: 15             # 16 拍 → 128 字节/burst
      burst_size: 3
      addr_mode: strided
      stride_bytes: 4096
      targets: {psram0: 0.95, sram0: 0.05}
      base_addr: 0x0000_0000
      size_bytes: 0x0800_0000
      qos: 8

  npu:
    queue_depth: 8
    max_outstanding: 24
    n_ids: 8
    port:
      traffic_class: bandwidth
      target_gbps: 1.50
      pattern: poisson
      rd_ratio: 0.70
      burst_len: 15
      burst_size: 3
      addr_mode: sequential
      targets: {psram0: 1.0}
      base_addr: 0x1000_0000
      size_bytes: 0x0800_0000
      qos: 8

  dma:
    queue_depth: 4
    max_outstanding: 12
    n_ids: 4
    port:
      traffic_class: bandwidth
      target_gbps: 0.80
      pattern: bursty
      on_off_ratio: 0.35
      rd_ratio: 0.50
      burst_len: 15
      burst_size: 3
      addr_mode: sequential
      targets: {psram0: 0.8, sram0: 0.2}
      base_addr: 0x1800_0000
      size_bytes: 0x0400_0000
      qos: 6

  storage:
    queue_depth: 4
    max_outstanding: 8
    n_ids: 4
    port:
      traffic_class: best_effort
      target_gbps: 0.35
      pattern: bursty
      on_off_ratio: 0.3
      rd_ratio: 0.40            # 存储控制器：读多为从介质读，写为回写
      burst_len: 15
      burst_size: 3
      addr_mode: sequential
      targets: {psram0: 1.0}
      base_addr: 0x2000_0000
      size_bytes: 0x0200_0000
      qos: 4

  network:
    queue_depth: 4
    max_outstanding: 8
    n_ids: 4
    port:
      traffic_class: best_effort
      target_gbps: 0.20
      pattern: bursty
      on_off_ratio: 0.25
      rd_ratio: 0.50
      burst_len: 7
      burst_size: 3
      addr_mode: random        # 网络收包地址分散
      targets: {psram0: 1.0}
      base_addr: 0x2200_0000
      size_bytes: 0x0100_0000
      qos: 2
